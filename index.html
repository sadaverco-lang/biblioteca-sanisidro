ul{list-style:none;margin:0;padding:0}

.info{flex:1;min-width:0}
.t{font:700 18px/1.25 Merriweather,Georgia,serif;margin:0}
.m{color:var(--muted);font-size:15px;margin:2px 0 0}
.msg{font-size:15px;margin:4px 0 0}

.ok .sello{color:var(--verde);background:var(--verdebg)}
.no .sello{color:var(--rojo);background:var(--rojobg)}
.vacio{padding:26px 0;color:var(--muted)}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function cats(){
  const lista=[...new Set(books.map(b=>b.categoria).filter(Boolean))];
  $("cats").innerHTML=['<button class="chip" data-c="" aria-pressed="'+(cat==="")+'">Todas</button>']
   .concat(lista.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${cat===c}">${esc(c)}</button>`)).join("");
}
function render(){
  const q=norm($("q").value.trim());
  const res=books.filter(b=>(disp==="todos"||(disp==="si")===b.disponible)&&(!cat||b.categoria===cat)&&
    (!q||norm([b.titulo,b.autor,b.categoria].join(" ")).includes(q)));
  const libres=books.filter(b=>b.disponible).length;
  $("count").textContent=q||cat||disp!=="todos"
    ? (res.length===1?"Encontré 1 libro":"Encontré "+res.length+" libros")
    : "Hoy tenemos "+libres+" libros listos para llevar, de "+books.length+" en total.";
  $("list").innerHTML=res.length?res.map(b=>`<li class="book ${b.disponible?"ok":"no"}"><div class="info"><p class="t">${esc(b.titulo)}</p><p class="m">${esc(b.autor)}${b.categoria?" · "+esc(b.categoria):""}</p><p class="msg">${b.disponible?"Está en la biblioteca"+(b.ubicacion?", en "+esc(b.ubicacion):"")+(b.total>1?" (quedan "+(b.total-b.prestados)+" de "+b.total+")":"")+".":"Por ahora no está disponible. Pregunta cuándo vuelve."}</p></div><span class="sello">${b.disponible?"Disponible":"No disponible"}</span></li>`).join(""):
   `<li class="vacio">Mmm, ese no lo encuentro. Prueba con otra palabra o pídelo abajo.</li>`;

}

function parseCSV(t){const rows=[];let r=[],f="",q=false;t=t.replace(/^\uFEFF/,"");
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
    else if(c==='"')q=true;else if(c===","||c===";"){r.push(f);f=""}
    else if(c==="\n"){r.push(f);rows.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
function desdeCSV(texto){
  const rows=parseCSV(texto);const h=rows.shift().map(x=>norm(x.trim()));const ix=n=>h.indexOf(n);
  const g=(r,n)=>ix(n)<0?"":(r[ix(n)]||"").trim();
  return rows.filter(r=>g(r,"titulo")).map(r=>{
    const total=parseInt(g(r,"ejemplares"))||1, pres=parseInt(g(r,"prestados"))||0;
    const disponible=ix("disponible")>=0?/^(si|sí|s|1|true|disponible)$/i.test(g(r,"disponible")):total-pres>0;
    return {titulo:g(r,"titulo"),autor:g(r,"autor"),categoria:g(r,"categoria"),ubicacion:g(r,"ubicacion"),total,prestados:pres,disponible}})}
